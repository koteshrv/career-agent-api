version: '3.8'

services:
  api:
    image: ghcr.io/koteshrv/career-agent-api:latest
    restart: unless-stopped
    # No `ports:` mapping on purpose. The app trusts the `CF-Connecting-IP`
    # header for rate limiting and it's only safe to trust because Cloudflare's
    # edge is guaranteed to be the sole path to this container — the
    # `cloudflared` service below reaches it over the internal db-network only.
    # Publishing 3000 to the host here would open a second, non-Cloudflare
    # path that can set that header to anything. For local debugging, publish
    # a port explicitly with `docker compose run --service-ports` instead of
    # adding it back here.
    environment:
      - DATABASE_URL=postgres://careeragent:secretpassword@postgres:5432/careeragent
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db-network

  # The only ingress path to `api`. Runs as an outbound-only connection to
  # Cloudflare's edge (no inbound port needed), which is what makes trusting
  # CF-Connecting-IP in the app safe — as long as `api` is never also given a
  # host port mapping alongside this.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - db-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeragent
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: careeragent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeragent -d careeragent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

volumes:
  postgres-data:
  redis-data:

networks:
  db-network:
    driver: bridge
