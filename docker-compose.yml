version: '3.8'

services:
  api:
    image: ghcr.io/koteshrv/career-agent-api:latest
    restart: unless-stopped
    # No `ports:` mapping on purpose. This is meant to sit behind a reverse
    # proxy of your choice (nginx, Caddy, a tunneling service, whatever fits
    # your setup) that's the sole path to this container, on the same
    # network — add that proxy as its own service below, on `db-network`,
    # and point it at `api:3000`. Publishing this container's port directly
    # on the host instead would open a second, unproxied path that can set
    # TRUSTED_IP_HEADER (below) to anything — see README.md's Security notes
    # before changing this.
    environment:
      - DATABASE_URL=postgres://careeragent:secretpassword@postgres:5432/careeragent
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - TRUSTED_IP_HEADER=${TRUSTED_IP_HEADER}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db-network

  # Add your reverse proxy here as its own service, on `db-network`, proxying
  # to `api:3000` — its shape depends entirely on what you're using (a
  # container-based proxy, a tunneling client, etc.), so there's no one
  # right answer to fill in for everyone. Whatever you choose, set
  # TRUSTED_IP_HEADER in .env to the header it sets with the real client IP.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeragent
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: careeragent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeragent -d careeragent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

volumes:
  postgres-data:
  redis-data:

networks:
  db-network:
    driver: bridge
